# ==============================================================================
# Spring Boot Configuration: Local Development & Cloud Production (Render)
# ==============================================================================

# Server Port (Render injects PORT dynamically; defaults to 8080 for local development)
server.port=${PORT:8080}

spring.application.name=vehicle-svc

# ------------------------------------------------------------------------------
# Database Connection Configuration
# ------------------------------------------------------------------------------
# In Production (Render):
#   Set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
#   Supports both PostgreSQL (Render Managed DB) and MySQL (External hosted / Local)
# In Local Development:
#   Defaults to local MySQL database on localhost:3306
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/vehicle_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345678}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:}

# HikariCP Connection Pool settings for cloud resilience
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ------------------------------------------------------------------------------
# JPA / Hibernate Configuration
# ------------------------------------------------------------------------------
# 'update' mode creates/updates tables without dropping existing production data
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# Actuator Health Checks (Used by Render for Health Checks)
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ------------------------------------------------------------------------------
# OpenAPI / Swagger Documentation
# ------------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ------------------------------------------------------------------------------
# Cross-Origin Resource Sharing (CORS) Configuration
# ------------------------------------------------------------------------------
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://*.vercel.app}
